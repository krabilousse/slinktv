name: Tagged release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SLINK_BUILD_PYTHON: python
      SLINK_KEYSTORE: ${{ github.workspace }}/signing.jks
      SLINK_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SLINK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SLINK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android SDK and signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$SLINK_KEYSTORE"
          chmod 600 "$SLINK_KEYSTORE"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify and build
        run: |
          set -eu
          python -m pip install streamlink==8.6.3 pytest
          python -m pytest tests -q
          bash ./gradlew testDebugUnitTest assembleRelease lintRelease --console=plain
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          python scripts/release.py --apk app/build/outputs/apk/release/app-release.apk --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --check-history
      - name: Publish immutable release
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published; refusing to replace it"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "SlinkTV ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md
          fi
          cp "dist/SlinkTV-${GITHUB_REF_NAME#v}.apk" dist/SlinkTV.apk
          (cd dist && sha256sum SlinkTV.apk >> SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" "dist/SlinkTV-${GITHUB_REF_NAME#v}.apk" dist/SlinkTV.apk dist/update.json dist/SHA256SUMS.txt --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --notes-file dist/release-notes.md
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file dist/release-notes.md
          fi
      - name: Test and lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.ref_name }}
          path: |
            app/build/test-results/
            app/build/reports/
      - name: Remove signing key
        if: always()
        run: rm -f -- "$SLINK_KEYSTORE"
