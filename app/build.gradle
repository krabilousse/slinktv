plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'tv.slink.app'
    compileSdk 36
    defaultConfig {
        applicationId 'tv.slink.app'
        minSdk 34
        targetSdk 36
        versionCode 16
        versionName '0.10.2'
        buildConfigField 'String', 'TWITCH_CLIENT_ID', '"n0w9arq3ba2jte7k24x2gje9xjstx3"'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('SLINK_KEYSTORE')) {
                storeFile file(System.getenv('SLINK_KEYSTORE'))
                storePassword System.getenv('SLINK_STORE_PASSWORD')
                keyAlias System.getenv('SLINK_KEY_ALIAS')
                keyPassword System.getenv('SLINK_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}

chaquopy {
    defaultConfig {
        version '3.11'
        if (System.getenv('SLINK_BUILD_PYTHON')) {
            buildPython System.getenv('SLINK_BUILD_PYTHON')
        }
        pip {
            install '-r', 'python-requirements.txt'
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.3'
    implementation 'androidx.media3:media3-datasource-okhttp:1.9.3'
    implementation 'androidx.media3:media3-ui:1.9.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
